name: CI

# Rede de proteção para PRs. Cada job abaixo trava um invariante que já foi
# quebrado de verdade neste repositório — os comentários dizem qual.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest (com OCR de verdade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versão espelhada de backend/Dockerfile (python:3.12-slim). Se o
      # Dockerfile mudar, este job precisa mudar junto — e falhar é o aviso.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Mesma lista de binários do backend/Dockerfile.
      - name: Binários de extração
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-por

      # 9 testes de OCR são @pytest.mark.skipif(not _HAS_TESSERACT): sem o
      # binário a suíte fica VERDE pulando todos eles em silêncio.
      - name: Guarda contra skip silencioso do OCR
        run: command -v tesseract

      # requirements-dev.txt traz pytest/pytest-asyncio e faz `-r requirements.txt`.
      # Instalar só o requirements.txt dava "No module named pytest" (medido).
      - name: Dependências
        run: pip install -r backend/requirements-dev.txt

      # Os testes de integração mockam o OpenSearch (MagicMock/patch), então
      # não há service container aqui de propósito. E pytest roda com cwd em
      # backend/, onde não existe .env — como no clone limpo do CI.
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: frontend · tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versão espelhada de frontend/Dockerfile (node:22-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências
        working-directory: frontend
        run: npm ci

      # `npm run build` é `tsc -b && vite build`: cobre tipos e bundle.
      - name: Build (inclui tsc)
        working-directory: frontend
        run: npm run build

      - name: Testes
        working-directory: frontend
        run: npm run test

  installers-macos:
    name: instaladores · bash 3.2 (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # O macOS entrega bash 3.2 e é o ÚNICO lugar que prova essa
      # compatibilidade: a arte do banner depende dela (sem ponto flutuante,
      # sem array associativo, sem `printf -v arr[i]`).
      - name: Sintaxe com o bash 3.2 do sistema
        run: |
          /bin/bash --version | head -1
          /bin/bash -n install.sh

      # Bloqueante: o main já esteve vermelho aqui sem ninguém ver.
      - name: ShellCheck
        run: |
          brew install shellcheck
          shellcheck -S warning install.sh

      - name: Testes do instalador
        run: /bin/bash tests/installer/run.sh

      # `--help` fazia `grep '^#' "$0"` e sob `curl | bash` o $0 é `bash`:
      # imprimia só "grep: bash: No such file or directory".
      - name: Pipe-safety (curl | bash simulado)
        run: cat install.sh | /bin/bash -s -- --help | grep -q 'AtlasFile installer'

      - name: Flag desconhecida deve falhar
        run: |
          if /bin/bash install.sh --nao-existe >/dev/null 2>&1; then
            echo "esperava exit != 0 para flag desconhecida" && exit 1
          fi

      # Sem TTY o banner nunca anima; só sob PTY o caminho de animação
      # (tput cuu, cursor escondido, trap de restauração) é exercitado.
      - name: Banner sob PTY (caminho de animação)
        run: |
          python3 - <<'PY'
          import os, pty, sys
          os.environ["TERM"] = "xterm-256color"
          os.environ["COLORTERM"] = "truecolor"
          st = pty.spawn(["/bin/bash", "-c",
                          "export ATLASFILE_INSTALL_LIB=1; source install.sh; print_banner"])
          sys.exit(1 if st and os.waitstatus_to_exitcode(st) else 0)
          PY

      # Sem instalação e sem manifesto, o uninstall deve recusar com mensagem
      # — nunca com stack trace.
      - name: Uninstall sem instalação recusa com mensagem
        run: |
          out="$(/bin/bash install.sh --uninstall --dir /tmp/nao-existe-atlasfile --keep-data --yes 2>&1 || true)"
          printf '%s\n' "$out" | grep -q 'no AtlasFile install found' || {
            echo "esperava a mensagem de instalação ausente; veio:"; printf '%s\n' "$out"; exit 1; }

  installers-linux:
    name: instaladores · bash 5 + smoke de detecção (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe
        run: bash -n install.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh

      # Mesma bateria do job macOS, aqui com bash 5: pega divergência entre
      # os dois bashes que o produto encontra em campo.
      - name: Testes do instalador
        run: bash tests/installer/run.sh

      - name: Consistência instalador × bancada × ajuda
        run: python3 tests/installer/check_consistency.py

      # O que o instalador ESCREVE dentro do clone tem de ser ignorado pelo git,
      # senão o guard de "local changes" do --uninstall dispara e a pasta de
      # instalação nunca é removida. Aconteceu de verdade: a linha do .gitignore
      # era "backend/runs/config/api_keys.json", duas entradas fundidas numa só,
      # que não ignorava NENHUMA das duas — e o one-liner recomendado usa
      # --enable-auth, que grava exatamente config/api_keys.json.
      - name: O git ignora o que o instalador gera
        run: |
          falhou=0
          for alvo in config/api_keys.json backend/runs/x .atlasfile-install-manifest; do
            if git check-ignore -q "$alvo"; then
              echo "  ok   $alvo"
            else
              echo "  FALHOU  $alvo não é ignorado pelo git"
              falhou=1
            fi
          done
          exit $falhou

      - name: Pipe-safety (curl | bash simulado)
        run: cat install.sh | bash -s -- --help | grep -q 'AtlasFile installer'

      # O runner já tem docker, git e compose v2: o smoke prova o caminho de
      # DETECÇÃO de pré-requisitos sem instalar nem mutar nada.
      - name: Smoke de detecção de pré-requisitos
        run: bash install.sh --yes --install-deps --bootstrap-only

  powershell:
    name: install.ps1 · ASCII, parse e degradação (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # O Windows PowerShell 5.1 lê arquivo sem BOM como ANSI e quebra no
      # primeiro glifo multibyte; e adicionar BOM quebra o `irm | iex`. Fonte
      # ASCII pura é a única forma que sobrevive aos dois caminhos.
      - name: install.ps1 precisa ser ASCII puro
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("$PWD/install.ps1")
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
            throw "install.ps1 tem $($bad.Count) bytes nao-ASCII: o PowerShell 5.1 le como ANSI e o parse quebra"
          }

      # Argumento iniciado por `-` e oferecido aos parametros da FUNCAO antes de
      # chegar ao comando nativo, e `-e` (do winget) e ambiguo com -ErrorAction/
      # -ErrorVariable. Medido num Windows 11 real: "O parametro nao pode ser
      # processado porque o nome de parametro 'e' e ambiguo". Por isso todo call
      # site de Invoke-Native passa array explicito, e isso fica travado aqui.
      - name: Chamadas de Invoke-Native usam array explicito
        shell: pwsh
        run: |
          $src = Get-Content -Raw ./install.ps1
          $bad = @()
          # Aceita @( ... ) e tambem variavel que ja contem o array ($args...).
          # O que NAO pode e argumento solto comecando com '-': esse vira
          # parametro da funcao. A regra anterior exigia literalmente '@(' e
          # reprovava `Invoke-Native wsl $argsSh`, que e igualmente seguro.
          # Invoke-NativeCapture tem o MESMO contrato de argumentos e precisa da
          # mesma guarda: sem o (?:Capture)? o regex passava reto por ela, e a
          # funcao mais nova ficava sem protecao nenhuma.
          foreach ($m in [regex]::Matches($src, 'Invoke-Native(?:Capture)?\s+(\w+)\s+(\S+)')) {
            $primeiro = $m.Groups[2].Value
            if ($primeiro -like '-*') { $bad += $m.Value.Trim() }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "$($bad.Count) chamada(s) de Invoke-Native com argumento solto - argumentos com traco viram parametro da funcao"
          }

      # Stop-Installer nao interrompe sozinho sob `irm | iex` (throw pintaria de
      # vermelho ate o caminho de sucesso). Quem chama TEM de encerrar com
      # `return`; sem isso o script continuaria depois de decidir parar.
      - name: Todo Stop-Installer encerra com return
        shell: pwsh
        run: |
          $bad = @()
          foreach ($linha in (Get-Content ./install.ps1)) {
            if ($linha -match 'Stop-Installer\s+\d' -and $linha -notmatch 'Stop-Installer\s+\d\s*;\s*return' -and $linha -notmatch '^\s*function') {
              $bad += $linha.Trim()
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "$($bad.Count) chamada(s) de Stop-Installer sem o return obrigatorio"
          }

      - name: Parse no Windows PowerShell 5.1
        shell: powershell
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$e)
          if ($e.Count -gt 0) { throw $e[0].Message }

      # A bancada que faltava: executa o INSTALADOR INTEIRO contra stubs de
      # winget/wsl/docker/ollama. Existe porque quatro bugs seguidos chegaram na
      # maquina do usuario por eu validar a funcao e nao a forma real de uso.
      - name: Testes do install.ps1 (instalador inteiro contra stubs)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          & .\tests\installer\win\run.ps1
          if ($LASTEXITCODE -ne 0) { throw "bancada do install.ps1 reprovou" }

      # Bloqueia em Error E em Warning. A primeira execucao do CI mediu 58
      # achados de Warning: 54x PSAvoidUsingWriteHost, 3x
      # PSUseShouldProcessForStateChangingFunctions e 1x
      # PSAvoidUsingEmptyCatchBlock. O catch vazio foi CORRIGIDO; as duas outras
      # regras sao excluidas com justificativa e nao por conveniencia:
      #   - Write-Host: um instalador existe para escrever no console, e a saida
      #     nao pode virar objeto de pipeline;
      #   - ShouldProcess: sao helpers internos do proprio script, nunca cmdlets
      #     exportados, e o consentimento ja e pedido por Confirm-Step.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # A galeria do PowerShell ja respondeu "No match was found ... module
          # name 'PSScriptAnalyzer'" num runner: e falha de INFRA, nao do codigo.
          # Tenta registrar/confiar no repositorio e repete uma vez; se ainda
          # assim nao houver modulo, AVISA e segue — os outros passos do job
          # (ASCII, parse, bancada, -Help) continuam bloqueando.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            try { Register-PSRepository -Default -ErrorAction SilentlyContinue } catch { }
            try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue } catch { }
            foreach ($tentativa in 1..2) {
              try { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop; break }
              catch { Write-Host "tentativa $tentativa falhou: $($_.Exception.Message)"; Start-Sleep -Seconds 5 }
            }
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Host "::warning::PSScriptAnalyzer indisponivel (galeria do PowerShell fora do ar) - passo pulado"
            exit 0
          }
          $excl = @('PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions')
          $found = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning -ExcludeRule $excl
          if ($found.Count -gt 0) {
            $found | Format-List
            throw "PSScriptAnalyzer: $($found.Count) achados fora das exclusoes justificadas"
          }
          Write-Host "PSScriptAnalyzer limpo (exclusoes: $($excl -join ', '))"

      # Os dois caminhos de entrega documentados precisam funcionar.
      - name: -Help por arquivo e por scriptblock
        shell: powershell
        run: |
          $viaFile = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Help | Out-String
          if ($viaFile -notmatch 'AtlasFile installer') { throw "-Help por arquivo nao imprimiu a ajuda" }
          # Em processo FILHO de proposito: o instalador termina com `exit`, e
          # num scriptblock isso encerraria a SESSAO do step, pulando o assert.
          $viaBlock = & powershell -NoProfile -Command "& ([scriptblock]::Create((Get-Content -Raw .\install.ps1))) -Help" | Out-String
          if ($viaBlock -notmatch 'AtlasFile installer') { throw "-Help por scriptblock nao imprimiu a ajuda" }

      # O runner não tem WSL2: é exatamente o cenário em que o instalador
      # morria com stack trace. Deve sair 1 com mensagem acionável.
      - name: Sem WSL, degrada com mensagem (nunca com stack trace)
        shell: powershell
        run: |
          # -Yes: o runner reporta UserInteractive=true, e sem isso o
          # Stop-Installer pararia num Read-Host esperando Enter.
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Yes 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Unhandled|FullyQualifiedErrorId\s*:\s*NativeCommandError') {
            throw "o instalador terminou com excecao em vez de mensagem"
          }
          if ($out -notmatch 'WSL2 is not usable|WSL2 available') {
            throw "nao houve veredito sobre o WSL2"
          }
          # O instalador sai != 0 de proposito quando falta um pre-requisito; o
          # que este step valida e COMO ele sai, nao o codigo em si.
          exit 0

  docker-build:
    name: imagens · docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sem .env o compose nem interpola (medido: falha em
      # OPENSEARCH_INITIAL_ADMIN_PASSWORD). Os placeholders do exemplo bastam
      # para construir — nada aqui sobe serviço nem usa credencial real.
      - name: .env a partir do exemplo
        run: cp .env.example .env

      # Constrói só api, mcp e web (os únicos com `build:`); as imagens do
      # OpenSearch têm `image:` e não são baixadas aqui.
      - name: Build das imagens
        run: docker compose build
