# Release por tag vX.Y.Z[-pre] (Fase 3 do plano de distribuição, v1.0.0).
#
# INVARIANTE do desenho: as tags do GHCR (X.Y.Z, X.Y, latest) só são aplicadas
# DEPOIS que o smoke E2E passou nos DOIS runners nativos contra os digests já
# publicados — `latest` nunca aponta para bits não testados. Smoke vermelho
# deixa apenas manifests sem tag (invisíveis a `docker pull`).
#
# Rollback: versão ruim já puxada NUNCA é re-tageada — publica-se X.Y.(Z+1).
# Digests órfãos de tentativas falhas são inofensivos (faxina opcional futura).
name: release

on:
  push:
    tags: ["v*"]

# Nunca cancelar release no meio (estado parcial no registry) — enfileira.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/aleonnet/atlasfile

jobs:
  version:
    name: versão · guardas da tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # merge-base precisa da história completa

      - name: Parse + guardas (formato, tag∈main, tag↔package.json)
        id: parse
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 1) formato: falha rápido antes de gastar runner ARM
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::tag '$TAG' não é vX.Y.Z[-pre] — nada publicado"; exit 1; }
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          # 2) tag tem de apontar para commit da main — a branch protection do
          #    repo segue desligada; esta guarda impede release de branch avulsa
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::a tag '$TAG' não aponta para commit contido na main"; exit 1; }
          # 3) tag ↔ repo: a base (sem sufixo -rc.N) tem de casar com o
          #    package.json, senão a UI mostraria uma versão e a API outra
          PKG="$(jq -r .version frontend/package.json)"
          [[ "$BASE" == "$PKG" ]] || {
            echo "::error::tag base '$BASE' != frontend/package.json '$PKG'"; exit 1; }
          {
            echo "version=${VERSION}"
            [[ "$VERSION" == *-* ]] && echo "prerelease=true" || echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build · ${{ matrix.platform }} (nativo, push por digest)
    needs: version
    strategy:
      fail-fast: true # release é tudo-ou-nada
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # GA/grátis SÓ em repo público — se o repo virar privado este job
          # morre com "runner not found"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Nome de artifact não aceita "/" — linux/amd64 vira linux-amd64
      - name: Plataforma sem barra
        run: |
          P='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${P//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só para LABELS OCI (as tags são aplicadas no job publish, pós-smoke).
      # org.opencontainers.image.source vincula pacote↔repo (belt-and-suspenders;
      # com GITHUB_TOKEN o vínculo já é automático no 1º push).
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      # push-by-digest: publica o manifest da arch SEM tag — acessível só como
      # $IMAGE@sha256:... . NÃO passar `tags:` aqui (com push-by-digest, falha).
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ATLASFILE_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=release-${{ env.PLATFORM_PAIR }},mode=max

      # Handoff por artifact com arquivo NOMEADO PELO DIGEST (padrão canônico):
      # outputs de job com matrix se sobrescrevem (last-wins), e arquivos de
      # nome fixo colidiriam no merge-multiple do publish — index de 1 arch só.
      - name: Exporta digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke E2E · ${{ matrix.platform }} (imagem publicada, por digest)
    needs: [version, build] # version no needs: só dependência DIRETA expõe outputs
    strategy:
      fail-fast: false # ver as duas arquiteturas até o fim é diagnóstico
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Plataforma sem barra
        run: |
          P='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${P//\//-}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests

      - name: Resolve a referência por digest desta arch
        run: |
          set -euo pipefail
          digest="sha256:$(ls "${RUNNER_TEMP}/digests")"
          echo "ATLASFILE_IMAGE=${IMAGE}@${digest}" >> "$GITHUB_ENV"

      # No ensaio rc.1 o pacote GHCR ainda é PRIVADO (1º push nasce privado;
      # o flip para público é manual, depois) — sem login o pull morre em 401.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Todas as variáveis :? do compose entram aqui — inclusive a do serviço
      # com profile desligado (dashboards): a interpolação roda ANTES do filtro
      # de profiles (provado no compose v5.3.1). EMBEDDING/AUTO_INGEST off:
      # zero chamadas OpenAI e scan determinístico (sem corrida com o watcher).
      - name: Ambiente (.env + api_keys.json + projects root)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/projects"
          SMOKE_KEY="atlas_sk_ci_$(openssl rand -hex 16)"
          # valor gerado em runtime não é mascarado sozinho e o log é público
          echo "::add-mask::${SMOKE_KEY}"
          PASS="Ci-Smoke!Pass-$(openssl rand -hex 8)"
          cat > .env <<EOF
          PROJECTS_HOST_ROOT=${RUNNER_TEMP}/projects
          OPENSEARCH_PASSWORD=${PASS}
          OPENSEARCH_INITIAL_ADMIN_PASSWORD=${PASS}
          DASHBOARDS_COOKIE_PASSWORD=$(openssl rand -hex 32)
          API_AUTH_ENABLED=true
          ATLASFILE_API_TOKEN=${SMOKE_KEY}
          ATLASFILE_VERSION=${{ needs.version.outputs.version }}
          ATLASFILE_IMAGE=${ATLASFILE_IMAGE}
          EMBEDDING_ENABLED=false
          AUTO_INGEST_ENABLED=false
          EOF
          # A MESMA key é credencial interna (orchestrator→/mcp, tools→API,
          # exige projects ["*"]) e key do smoke externo.
          printf '{"keys": [{"key": "%s", "name": "ci-smoke", "projects": ["*"]}]}\n' \
            "$SMOKE_KEY" > config/api_keys.json
          echo "SMOKE_KEY=${SMOKE_KEY}" >> "$GITHUB_ENV"

      - name: Sobe a stack pela imagem publicada
        run: |
          docker compose pull
          docker compose up -d --wait --wait-timeout 300

      - name: Smoke de inicialização (reuso)
        env:
          ATLASFILE_SMOKE_API_KEY: ${{ env.SMOKE_KEY }}
        run: bash scripts/smoke-project-init.sh

      - name: Smoke E2E (versão, ingestão, OCR, triagem, busca, /mcp)
        env:
          ATLASFILE_SMOKE_API_KEY: ${{ env.SMOKE_KEY }}
          ATLASFILE_SMOKE_EXPECT_VERSION: ${{ needs.version.outputs.version }}
          ATLASFILE_SMOKE_IMAGE: ${{ env.ATLASFILE_IMAGE }}
        run: bash scripts/smoke-e2e.sh

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 || true

  publish:
    name: publish · tags + proveniência + bundle + Release
    needs: [version, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh-release
      packages: write # imagetools create + attest push-to-registry
      id-token: write # attest (Sigstore)
      attestations: write
      artifact-metadata: write # storage record do actions/attest (v4)
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=semver implementa a regra de pré-release sozinho: v1.0.0-rc.1
      # gera SÓ "1.0.0-rc.1" (sem X.Y e sem latest; latest=auto só em estável).
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: actions/download-artifact@v6
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: imagetools create (merge dos digests + tags finais)
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # word splitting deliberado (tags não têm espaço)
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf -- "${IMAGE}@sha256:%s " *)

      - name: Digest do index + prova multi-arch
        id: digest
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect "$ref" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/aleonnet/atlasfile # sem tag (regra da action)
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Bundle ~10 KB: o único conteúdo do repo que o usuário final precisa
      # (a Fase 4a ensina o instalador a consumi-lo).
      - name: Monta o bundle
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          root="atlasfile-${V}"
          mkdir -p "dist/${root}/config"
          cp docker-compose.yml .env.example "dist/${root}/"
          cp config/opensearch_dashboards.yml config/api_keys.example.json "dist/${root}/config/"
          # bundle nasce pinado: instalação manual já tem a versão no .env
          printf '\nATLASFILE_VERSION=%s\n' "$V" >> "dist/${root}/.env.example"
          tar -czf "atlasfile-${V}-bundle.tar.gz" -C dist "${root}"
          sha256sum "atlasfile-${V}-bundle.tar.gz" > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            atlasfile-*-bundle.tar.gz
            SHA256SUMS
          body: |
            Imagem: `ghcr.io/aleonnet/atlasfile:${{ needs.version.outputs.version }}`
            Digest do manifest (multi-arch amd64+arm64): `${{ steps.digest.outputs.digest }}`

            Verificação de proveniência:
            ```
            gh attestation verify oci://ghcr.io/aleonnet/atlasfile:${{ needs.version.outputs.version }} -R aleonnet/atlasfile
            ```
