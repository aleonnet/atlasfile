services:
  opensearch:
    # Digest pinado (padrão Immich): a tag é legibilidade, o digest é o que
    # garante o mesmo bit em qualquer máquina. Guarda em scripts/check_pins.sh.
    image: opensearchproject/opensearch:2.17.1@sha256:1193b7c29c5d63028523728243cc4da047ac49f697a8f8105e5aeee2f89bcc4c
    container_name: atlasfile-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # 1g: incidente 2026-07-25 — com 512m o parent breaker saturou de fato
      # (502.6mb > 486.3mb, 72 trips) sob carga de indexação com vetores kNN
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?defina OPENSEARCH_INITIAL_ADMIN_PASSWORD no .env (o install.sh gera automaticamente)}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # 127.0.0.1 por default: consenso dos apps self-hosted (n8n/Immich/
    # Paperless/Sentry nao publicam o banco no host) e o Docker publica portas
    # POR CIMA do firewall do host. Localhost segue funcionando (make
    # reset-index, curl das docs); rede local exige OPENSEARCH_BIND=0.0.0.0
    # no .env. A 9600 (performance analyzer) saiu: zero consumidores.
    ports:
      - "${OPENSEARCH_BIND:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    # Ordem de start não é ordem de prontidão: o app só sobe quando o cluster
    # responde autenticado. Janela espelha o retry-loop do startup da API
    # (30 × 2s) que este healthcheck substitui como fonte de espera.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" https://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # Opt-in: `docker compose --profile dashboards up -d` + DASHBOARDS_ENABLED=true
  # no .env (a env liga o link de observabilidade na UI e o auto-import).
  # Dashboards é ~1/3 do download de terceiros e o produto opera sem ele.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1@sha256:dc12b6f576aae6024780c01b3cc81abdf611d34340371980ef8edc7738479b8f
    container_name: atlasfile-dashboards
    restart: unless-stopped
    profiles: [dashboards]
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?defina OPENSEARCH_INITIAL_ADMIN_PASSWORD no .env (o install.sh gera automaticamente)}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    # Chave do cookie de sessão por instalação: cookie de instância anterior vira
    # redirect limpo de login em vez de 500 (chave default é igual entre instâncias).
    # Vai como flag CLI porque a allowlist de env do entrypoint não cobre
    # opensearch_security.* (verificado na imagem 2.17.1); o entrypoint prefixa
    # "opensearch-dashboards" quando o 1º argumento começa com "-".
    command: ["--opensearch_security.cookie.password=${DASHBOARDS_COOKIE_PASSWORD:?defina DASHBOARDS_COOKIE_PASSWORD no .env (install.sh ou make docker-up geram automaticamente)}"]
    volumes:
      # Permite header securitytenant no import (tenant Global); conexão segue das env acima.
      - ./config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    ports:
      # Porta de host configuravel; o backend recebe DASHBOARDS_PUBLIC_PORT
      # para o link "Observabilidade" acompanhar. Sem 127.0.0.1: o SSO deriva
      # http://<host>:<porta> para acesso remoto a UI.
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      - opensearch

  # Um app, um container: uvicorn serve a API (/api/*, /health), o MCP (/mcp)
  # e a UI de produção (/) — bundle vite copiado no estágio webbuild da imagem.
  atlasfile:
    # v1.0.0: consumo por imagem publicada — o build local vive em
    # docker-compose.build.yml (dev/contribuidor; `make docker-up` usa os dois
    # arquivos). ATLASFILE_IMAGE é a via do smoke de release (referência por
    # digest, antes de existir tag); usuário final só define ATLASFILE_VERSION,
    # sem default de propósito: `latest` implícito faria duas instalações em
    # datas diferentes divergirem. O :? interno é lazy (só dispara sem as duas).
    image: ${ATLASFILE_IMAGE:-ghcr.io/aleonnet/atlasfile:${ATLASFILE_VERSION:?ATLASFILE_VERSION missing in .env - run 'make docker-up' (writes it automatically) or set the release version}}
    container_name: atlasfile
    restart: unless-stopped
    environment:
      # Mesma origem por padrão — CORS só é necessário atrás de proxy/origem externa.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - OPENSEARCH_HOST=https://opensearch:9200
      - OPENSEARCH_INDEX=atlasfile_documents
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?defina OPENSEARCH_INITIAL_ADMIN_PASSWORD no .env (o install.sh gera automaticamente)}
      - PROJECTS_ROOT=/projects
      # Dashboards é opt-in (profile "dashboards"): a env esconde/exibe o link
      # de observabilidade e gateia o auto-import no boot.
      - DASHBOARDS_ENABLED=${DASHBOARDS_ENABLED:-false}
      - DASHBOARDS_URL=${DASHBOARDS_URL:-http://opensearch-dashboards:5601}
      - DASHBOARDS_AUTO_IMPORT=${DASHBOARDS_AUTO_IMPORT:-true}
      # URL do Dashboards para o BROWSER (proxy/acesso remoto); vazio = o
      # backend deriva do host da request
      - DASHBOARDS_PUBLIC_URL=${DASHBOARDS_PUBLIC_URL:-}
      # Porta de HOST do Dashboards, para o link derivado nao apontar para um
      # :5601 que o usuario remapeou (DASHBOARDS_PUBLIC_URL segue soberana)
      - DASHBOARDS_PUBLIC_PORT=${DASHBOARDS_PORT:-5601}
      # Caminho do host montado em /projects — informativo, para a UI mostrar
      # ao usuário onde os arquivos ficam fisicamente
      - PROJECTS_HOST_ROOT=${PROJECTS_HOST_ROOT:-}
      - CLASSIFIER_DATASETS_ROOT=${CLASSIFIER_DATASETS_ROOT:-/projects/_ATLASFILE/classifier/datasets}
      - AUTO_RECONCILE_INTERVAL_SECONDS=${AUTO_RECONCILE_INTERVAL_SECONDS:-600}
      - AUTO_RECONCILE_REINDEX_SEARCH=${AUTO_RECONCILE_REINDEX_SEARCH:-true}
      # MCP no mesmo processo (/mcp); MCP_SERVER_URL default já é o loopback.
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gpt-4o-mini}
      - CLASSIFICATION_LLM_ENABLED=${CLASSIFICATION_LLM_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Providers OpenAI-compatíveis (Moonshot/Kimi e Ollama local via base_url)
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}
      # Dentro do container, o Ollama do host é alcançado via host.docker.internal
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Channels (messaging)
      - CHANNELS_ENABLED=${CHANNELS_ENABLED:-false}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Autenticação (API key + escopo de projeto). Keys em config/api_keys.json,
      # bind mount abaixo — trocar key NÃO exige rebuild. Com auth ligado, a
      # ATLASFILE_API_TOKEN é a credencial do processo consigo mesmo
      # (orchestrator→/mcp e tools→API) e precisa constar em api_keys.json.
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - ATLASFILE_API_TOKEN=${ATLASFILE_API_TOKEN:-}
      # v1.0.0: repassadas para o smoke de release poder desligar (embeddings
      # sem OPENAI_API_KEY = exception logada por doc/busca; auto-ingest
      # disputa o lock do scan manual → 409). Off pula o caminho caro inteiro.
      - EMBEDDING_ENABLED=${EMBEDDING_ENABLED:-true}
      - AUTO_INGEST_ENABLED=${AUTO_INGEST_ENABLED:-true}
    extra_hosts:
      # Linux Docker Engine: host.docker.internal só resolve com host-gateway
      # (inócuo no Docker Desktop mac/win) — necessário para o OLLAMA_BASE_URL default
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROJECTS_HOST_ROOT}:/projects
      # A key sai da camada de imagem (era assada pelo COPY config). ATENÇÃO:
      # se o arquivo não existir no host, o Docker cria um DIRETÓRIO no lugar e
      # o auth passa a rejeitar toda key — install.sh e make docker-up/update
      # materializam {"keys": []} antes do up.
      - ./config/api_keys.json:/workspace/config/api_keys.json
    ports:
      # ATLASFILE_PORT no .env (ou --port do instalador). Em todas as
      # interfaces por decisao: a UI e acessivel da rede local.
      - "${ATLASFILE_PORT:-8000}:8000"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      # A imagem (python:3.12-slim) não tem curl; urllib levanta em != 2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      # 90s: o primeiro boot faz 5 ensure_index + backfills no lifespan e num
      # runner de 4 vCPU a janela antiga (10s + 12×5s) era apertada — unhealthy
      # é terminal para `up --wait` (o gate do release). Inócuo em produção:
      # o start_period não atrasa a detecção de crash pós-boot (retries mantém).
      start_period: 90s

volumes:
  opensearch_data:
